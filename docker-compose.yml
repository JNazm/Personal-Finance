services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-personal_finance}
      POSTGRES_USER: ${DB_USERNAME:-personal_finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.docker}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-personal_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.docker}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal
      - edge

  # Optional alternative to port-forwarding + Caddy's public ports above.
  # Use this if your ISP's router is behind CGNAT (common on Malaysian home
  # fibre plans) so no public IP ever reaches your router. Requires a free
  # Cloudflare account with the domain's nameservers pointed at Cloudflare,
  # and a tunnel token from the Cloudflare Zero Trust dashboard.
  # Start with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
  # Shared with the separate WhisperDesk stack (whisperdesk/docker-compose.yml)
  # so Caddy can reverse-proxy to it by container name. Create once with:
  #   docker network create edge
  edge:
    external: true

volumes:
  db_data:
  app_storage:
  caddy_data:
  caddy_config:
