services:
  - type: web
    name: personal-finance
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Personal Finance"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: personal-finance
          property: hostport
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: personal-finance-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: personal-finance-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: personal-finance-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: personal-finance-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: personal-finance-db
          property: password
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database

databases:
  - name: personal-finance-db
    databaseName: personal_finance
    user: personal_finance
    plan: free
