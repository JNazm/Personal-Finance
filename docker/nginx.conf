user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        # Caddy already strips the "/personal-finance" prefix before proxying
        # here (see docker/Caddyfile), for both the port-forwarded and
        # Cloudflare Tunnel front doors — the tunnel now points at Caddy, not
        # this container, directly. This rewrite is kept as a harmless
        # defensive fallback in case something ever proxies to this
        # container with the prefix still attached.
        rewrite ^/personal-finance$ /personal-finance/ permanent;
        rewrite ^/personal-finance/(.*)$ /$1 break;

        location / {
            try_files $uri $uri/ @laravel;
        }

        location @laravel {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            include fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_param REQUEST_URI $uri$is_args$args;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_param REQUEST_URI $uri$is_args$args;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
