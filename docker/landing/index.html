<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nazmi Finance</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    .card {
      width: min(92vw, 720px);
      text-align: center;
      padding: 3rem 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p.subtitle { color: #94a3b8; margin-top: 0; margin-bottom: 2.5rem; }
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 560px) {
      .choices { grid-template-columns: 1fr; }
    }
    a.choice {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem 1.25rem;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    a.choice:hover {
      transform: translateY(-4px);
      border-color: #60a5fa;
    }
    .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .choice h2 { margin: 0 0 0.35rem; font-size: 1.25rem; }
    .choice p { margin: 0; color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome</h1>
    <p class="subtitle">Choose where you'd like to go.</p>
    <div class="choices">
      <a class="choice" href="/personal-finance">
        <div class="icon">💰</div>
        <h2>Personal Finance</h2>
        <p>Track your budget, debts and commitments.</p>
      </a>
      <a class="choice" href="/whisperdesk">
        <div class="icon">🎙️</div>
        <h2>WhisperDesk</h2>
        <p>Upload a recording and get a transcript.</p>
      </a>
    </div>
  </div>
</body>
</html>
